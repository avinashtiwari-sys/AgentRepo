# GTMFlow reverse proxy.
#
# The webhook carries a shared secret (X-Zoho-Webhook-Token), so it MUST be
# served over HTTPS in production. Provision a certificate with certbot:
#
#     sudo certbot --nginx -d your-domain.com
#
# certbot will fill in the ssl_certificate paths below and wire up the redirect.
# Until a domain/cert exists, the plain :80 block keeps the service reachable for
# local/EC2-IP testing only — do not point a live Zoho webhook at it.

# Redirect all HTTP traffic to HTTPS (active once a cert is installed).
server {
    listen 80;
    server_name your-domain.com;  # replace with your domain

    # Allow ACME http-01 challenges through for certbot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name your-domain.com;  # replace with your domain

    # Managed by certbot (`sudo certbot --nginx`):
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep webhook connections alive
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }
}
