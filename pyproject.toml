[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtmflow"
version = "0.1.0"
description = "Automated lead qualification and routing pipeline for Zoho CRM"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Avinash Tiwari" },
]
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-dotenv==1.0.1",
    "dnspython==2.6.1",
    "httpx==0.27.0",
    "sqlalchemy>=2.0.50",
    "anthropic==0.28.0",
    "email-validator>=2.0.0",
    "redis==5.0.4",
    "rq==1.16.2",
    "alembic==1.13.2",
    "slowapi==0.1.9",
    "sentry-sdk==2.15.0",
]

[project.scripts]
gtmflow = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app", "models", "workers"]
